# melpazoid <https://github.com/riscy/melpazoid> build checks.
# Catches stylistic issues like top-level define-key, bolp suggestions, etc.

name: melpazoid

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install
      run: |
        sudo apt-get update && sudo apt-get install -y emacs
        emacs --version
        git clone https://github.com/riscy/melpazoid.git ~/melpazoid
    - name: Run
      env:
        LOCAL_REPO: ${{ github.workspace }}
        # Mirrors the real MELPA recipe plus a :files scope: melpazoid's
        # namespace check cannot exempt the legacy compat stub
        # (pi-coding-agent.el), which is linted by `make lint` as its own
        # main file instead.
        RECIPE: (piem :fetcher github :repo "dnouri/piem" :old-names (pi-coding-agent) :files ("piem*.el"))
        WARN_IS_ERROR: false
        EXIST_OK: true
      run: make -C ~/melpazoid
